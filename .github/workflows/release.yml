name: Release

# When a push to master passes Validate and manifest.json has a version that
# hasn't been released yet, tag it and publish a release listing the commits
# since the previous one.
on:
  workflow_run:
    workflows: [Validate]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
      - name: Release the manifest version if it's new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version custom_components/neosmartblinds/manifest.json)
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag is already released"
            exit 0
          fi
          previous=$(git describe --tags --abbrev=0 --match 'v*' "$SHA" 2>/dev/null || true)
          {
            echo "## Changes"
            echo
            if [ -n "$previous" ]; then
              git log --no-merges --format='- %s' "$previous..$SHA"
              echo
              echo "**Full changelog:** https://github.com/${GITHUB_REPOSITORY}/compare/$previous...$tag"
            else
              git log --no-merges --format='- %s' -20 "$SHA"
            fi
          } > notes.md
          cat notes.md
          gh release create "$tag" --target "$SHA" --title "$tag" --notes-file notes.md --latest
